<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sierpinski</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Triângulo de Sierpinski</h1>

  <div class="controle">

  <canvas id="tela" width="700" height="620"></canvas>

  <small>Use as setas do teclado para aumentar ou diminuir o nível.</small>

  <script src="script.js"></script>
</body>
